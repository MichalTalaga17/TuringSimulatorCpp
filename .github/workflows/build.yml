name: Build and Package

on:
  push:
    tags:
      - 'v*' # Runs automatically when you push a tag like v1.0
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # We use an older Ubuntu version to ensure the AppImage works on older Linux systems
        os: [ubuntu-22.04, windows-latest, macos-latest]
        include:
          - os: windows-latest
            qt_arch: 'win64_msvc2022_64'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0' 
          arch: ${{ matrix.qt_arch }}
          
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 patchelf libfuse2 libxcb-cursor0

      - name: Configure CMake (Linux & Windows)
        if: matrix.os != 'macos-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENGL_opengl_LIBRARY="/System/Library/Frameworks/OpenGL.framework" -DOPENGL_gl_LIBRARY="/System/Library/Frameworks/OpenGL.framework" -DOPENGL_glu_LIBRARY="/System/Library/Frameworks/OpenGL.framework"
      
      - name: Build Project
        run: cmake --build build --config Release

      - name: Package Linux (AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p AppDir/usr/bin
          cp build/TuringSimulatorCpp AppDir/usr/bin/
          
          echo "[Desktop Entry]" > AppDir/TuringSimulatorCpp.desktop
          echo "Name=TuringSimulatorCpp" >> AppDir/TuringSimulatorCpp.desktop
          echo "Exec=TuringSimulatorCpp %F" >> AppDir/TuringSimulatorCpp.desktop
          echo "Icon=TuringSimulatorCpp" >> AppDir/TuringSimulatorCpp.desktop
          echo "Type=Application" >> AppDir/TuringSimulatorCpp.desktop
          echo "Categories=Utility;" >> AppDir/TuringSimulatorCpp.desktop
          
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="blue"/></svg>' > AppDir/TuringSimulatorCpp.svg
          
          # Force the AppImage to execute the binary directly, bypassing the buggy launcher
          ln -s usr/bin/TuringSimulatorCpp AppDir/AppRun
          
          # Download modern linuxdeploy and its Qt plugin
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
      
          # Delete exotic database drivers so the packager ignores them
          find ~/work -name "libqsqlmimer.so" -delete
          find ~/work -name "libqsqlodbc.so" -delete
      
          # Explicitly pass the Qt 6 qmake path to the plugin and build the AppImage
          export QMAKE=$(which qmake)
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage
          
          mv TuringSimulatorCpp*.AppImage TuringSimulatorCpp-Linux.AppImage

      - name: Package Windows (Portable Zip)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir release_folder
          # Windows CMake builds typically place the exe in a Release subfolder
          cp build\Release\TuringSimulatorCpp.exe release_folder\
          windeployqt release_folder\TuringSimulatorCpp.exe
          Compress-Archive -Path release_folder\* -DestinationPath TuringSimulatorCpp-Windows.zip

      - name: Package macOS (DMG)
        if: matrix.os == 'macos-latest'
        run: |
          # Bundle the Qt frameworks into the .app and convert it to a .dmg
          macdeployqt build/TuringSimulatorCpp.app -dmg
          mv build/TuringSimulatorCpp.dmg TuringSimulatorCpp-macOS.dmg

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-${{ matrix.os }}
          path: |
            *.AppImage
            *.zip
            *.dmg